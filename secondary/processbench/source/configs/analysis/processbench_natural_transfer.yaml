  first_error_boundary: public zero-based ProcessBench first-error label
  all_correct_boundary: paired first-error ordinal mapped into the all-correct trace
  all_correct_boundary_is_natural_error: false
  include_first_step_errors: true
  post_boundary_steps_visible: false
  label_visible_to_model: false
  visible_fields: [problem, steps_through_mapped_boundary, fixed_instruction]
  forbidden_fields:
    - id
    - generator
    - raw_label
    - first_error
    - is_all_correct
    - final_answer_correct
    - pair_id
    - transfer_role

# Each behavior or recapture row represents one selected trace. Each transfer
# row contains both candidate scores and is counted once at the prediction-row
# level, matching the existing common-core patch output convention.
run_roles:
  smoke:
    pair_count: 8
    authorization_scope: smoke_only
    authorization_inherited: false
    expected_rows:
      behavior: 16
      recapture: 16
      transfer: 96
      total: 128
  full:
    pair_count: 64
    authorization_scope: full_only
    authorization_inherited: false
    expected_rows:
      behavior: 128
      recapture: 128
      transfer: 768
      total: 1024

stage_contract:
  execution_order: [behavior, recapture, transfer]
  behavior:
    rows_per_pair: 2
    roles: [matched_correct, first_error]
    use_full_source_population: false
    result_gate: false
  recapture:
    rows_per_pair: 2
    roles: [matched_correct, first_error]
    sites_from_profile_anchor: true
    arrays_per_row: 2
  transfer:
    rows_per_pair: 12
    patch_mode: single_site_sweep
    directions:
      - matched_correct_to_first_error
      - first_error_to_matched_correct
    arms:
      - name: unpatched
        rows_per_pair: 2
        index: receiver_role
      - name: unpatched_rerun
        rows_per_pair: 2
        index: receiver_role
      - name: self_patch
        rows_per_pair: 4
        index: receiver_role_x_site
      - name: paired_transfer
        rows_per_pair: 4
        index: direction_x_site
    require_candidate_patch_diagnostics: true
    require_router_dispatch_for_site_kinds: [router_logits]
    forced_reroute_control: false

